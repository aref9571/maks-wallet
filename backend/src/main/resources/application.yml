spring:
  application:
    name: maks-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maks}
    username: ${DB_USERNAME:maks_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
maks:
  app:
    version: ${APP_VERSION:dev}
