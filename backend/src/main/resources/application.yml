spring:
  application:
    name: maks-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maks}
    username: ${DB_USERNAME:maks_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
maks:
  app:
    version: ${APP_VERSION:dev}
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktbm90LWEtcmVhbC1zZWNyZXQtMDEyMzQ1Njc4OQ==}
    issuer: maks-api
    access-token-lifetime: 15m
